name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after build+assert (bypasses DEPLOY_ENABLED for first launch)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically; ruby-version input omitted -> reads .ruby-version (D-07)
          cache-version: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate content
        run: bundle exec ruby scripts/validate.rb
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Smoke assertions
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          scripts/ci-smoke.sh _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: vars.DEPLOY_ENABLED == 'true' || inputs.deploy == true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub
        id: deployment
        uses: actions/deploy-pages@v5
